services:
  - type: web
    name: moodleboard-backend
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: moodleboard-backend
          property: port
    healthCheckPath: /api/health